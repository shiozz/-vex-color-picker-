<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Color Picker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #0e0e10; color: #fff; font-family: 'JetBrains Mono', 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 28px 20px 32px; gap: 20px; }

  #preview { width: 100%; max-width: 380px; height: 110px; border-radius: 12px; background: #ff0000; transition: background 0.05s; flex-shrink: 0; }

  .picker-wrap { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
  .slider-row { display: flex; align-items: center; gap: 14px; }
  .slider-label { font-size: 11px; color: #555; width: 14px; text-align: center; flex-shrink: 0; }
  input[type=range] { -webkit-appearance: none; flex: 1; height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px rgba(0,0,0,0.6); cursor: pointer; }
  #h-slider { background: linear-gradient(to right, hsl(0,100%,50%), hsl(30,100%,50%), hsl(60,100%,50%), hsl(90,100%,50%), hsl(120,100%,50%), hsl(150,100%,50%), hsl(180,100%,50%), hsl(210,100%,50%), hsl(240,100%,50%), hsl(270,100%,50%), hsl(300,100%,50%), hsl(330,100%,50%), hsl(360,100%,50%)); }

  #output { width: 100%; max-width: 380px; background: #16161a; border: 1px solid #2a2a30; border-radius: 10px; padding: 16px 20px; font-size: 16px; color: #e8c97a; letter-spacing: 0.03em; text-align: center; cursor: pointer; user-select: all; }

  .action-row { width: 100%; max-width: 380px; display: flex; gap: 8px; }
  #copy-btn { flex: 1; background: #1e1e24; border: 1px solid #2a2a30; border-radius: 10px; padding: 14px; font-family: inherit; font-size: 12px; color: #888; cursor: pointer; transition: color 0.2s, border-color 0.2s; letter-spacing: 0.08em; }
  #copy-btn.copied { color: #a8e87a; border-color: #a8e87a; }

  .icon-btn { width: 50px; height: 50px; background: #1e1e24; border: 1px solid #2a2a30; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; flex-shrink: 0; }
  .icon-btn:hover { border-color: #555; background: #252530; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.active { border-color: #7ac8e8; }

  .section-label { width: 100%; max-width: 380px; font-size: 12px; color: #888; letter-spacing: 0.12em; }

  .history-row { width: 100%; max-width: 380px; display: flex; gap: 8px; }
  .history-swatch { flex: 1; height: 36px; border-radius: 8px; background: #1a1a1e; border: 1px solid #2a2a30; cursor: pointer; transition: transform 0.1s, border-color 0.15s; }
  .history-swatch:hover { transform: scaleY(1.1); border-color: #555; }
  .history-swatch.empty { cursor: default; }
  .history-swatch.empty:hover { transform: none; border-color: #2a2a30; }

  .saved-header { width: 100%; max-width: 380px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .saved-toggle { font-size: 12px; color: #888; letter-spacing: 0.04em; transition: color 0.2s; }
  .saved-toggle:hover { color: #ccc; }

  #saved-grid { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
  #saved-grid.open { max-height: 600px; }

  .saved-item { display: flex; align-items: center; gap: 10px; background: #16161a; border: 1px solid #2a2a30; border-radius: 8px; padding: 8px 12px; transition: border-color 0.15s; }
  .saved-item:hover { border-color: #3a3a45; }
  .saved-swatch { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; }
  .saved-name { flex: 1; font-size: 11px; color: #888; outline: none; background: transparent; border: none; font-family: inherit; cursor: text; letter-spacing: 0.03em; }
  .saved-name:focus { color: #ccc; }
  .saved-value { font-size: 10px; color: #444; letter-spacing: 0.02em; cursor: pointer; }
  .saved-value:hover { color: #888; }
  .saved-del { font-size: 14px; color: #2a2a30; cursor: pointer; padding: 0 2px; transition: color 0.15s; line-height: 1; }
  .saved-del:hover { color: #e87a7a; }

  #save-btn { width: 100%; background: transparent; border: 1px dashed #2a2a30; border-radius: 8px; padding: 10px; font-family: inherit; font-size: 11px; color: #333; cursor: pointer; letter-spacing: 0.08em; transition: color 0.2s, border-color 0.2s; }
  #save-btn:hover { color: #666; border-color: #555; }
</style>
</head>
<body>

<div id="preview"></div>

<div class="picker-wrap">
  <div class="slider-row"><span class="slider-label">H</span><input type="range" id="h-slider" min="0" max="360" value="0"></div>
  <div class="slider-row"><span class="slider-label">S</span><input type="range" id="s-slider" min="0" max="100" value="100"></div>
  <div class="slider-row"><span class="slider-label">B</span><input type="range" id="b-slider" min="0" max="100" value="100"></div>
</div>

<div id="output">{1.000, 0.000, 0.000}</div>

<div class="action-row">
  <button id="copy-btn">COPY</button>
  <div class="icon-btn" id="eyedropper-btn" title="スポイド">
    <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.71 5.63l-2.34-2.34a1 1 0 0 0-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 0 0 5 16v3h3a2 2 0 0 0 1.42-.59l6.6-6.6 1.41 1.42 1.42-1.42-1.42-1.41 3.12-3.12a1 1 0 0 0 0-1.65z"/>
    </svg>
  </div>
</div>

<div class="section-label">HISTORY</div>
<div class="history-row" id="history-row">
  <div class="history-swatch empty"></div>
  <div class="history-swatch empty"></div>
  <div class="history-swatch empty"></div>
  <div class="history-swatch empty"></div>
  <div class="history-swatch empty"></div>
</div>

<div class="saved-header" id="saved-header">
  
  <span class="saved-toggle" id="saved-toggle">SAVED ▼</span>
</div>

<div id="saved-grid">
  <button id="save-btn">+ 現在の色を保存</button>
</div>

<script>
  const hSlider = document.getElementById('h-slider')
  const sSlider = document.getElementById('s-slider')
  const bSlider = document.getElementById('b-slider')
  const preview = document.getElementById('preview')
  const output = document.getElementById('output')
  const copyBtn = document.getElementById('copy-btn')
  const eyedropperBtn = document.getElementById('eyedropper-btn')
  const historyRow = document.getElementById('history-row')
  const savedGrid = document.getElementById('saved-grid')
  const saveBtn = document.getElementById('save-btn')
  const savedHeader = document.getElementById('saved-header')
  const savedToggle = document.getElementById('saved-toggle')

  let history = []
  let saved = JSON.parse(localStorage.getItem('vex-cp-saved') || '[]')
  let savedOpen = false

  if (!window.EyeDropper) {
    eyedropperBtn.style.opacity = '0.3'
    eyedropperBtn.style.pointerEvents = 'none'
    eyedropperBtn.title = 'Chrome/Edge のみ対応'
  }

  function hsbToRgb(h, s, v) {
    s /= 100; v /= 100
    const k = n => (n + h / 60) % 6
    const f = n => v - v * s * Math.max(0, Math.min(k(n), 4 - k(n), 1))
    return [f(5), f(3), f(1)]
  }

  function rgbToHsb(r, g, b) {
    r /= 255; g /= 255; b /= 255
    const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min
    let h = 0, s = max === 0 ? 0 : d / max, v = max
    if (d !== 0) {
      switch(max) {
        case r: h = ((g-b)/d + (g<b?6:0)) / 6; break
        case g: h = ((b-r)/d + 2) / 6; break
        case b: h = ((r-g)/d + 4) / 6; break
      }
    }
    return [Math.round(h*360), Math.round(s*100), Math.round(v*100)]
  }

  function rgbToHex(r, g, b) {
    return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('').toUpperCase()
  }

  function update() {
    const h = +hSlider.value, s = +sSlider.value, b = +bSlider.value
    const [r,g,bl] = hsbToRgb(h,s,b)
    const ri = Math.round(r*255), gi = Math.round(g*255), bi = Math.round(bl*255)
    preview.style.background = `rgb(${ri},${gi},${bi})`
    sSlider.style.background = `linear-gradient(to right, hsl(${h},0%,${b}%), hsl(${h},100%,${b/2+b*s/200}%))`
    bSlider.style.background = `linear-gradient(to right, #000, hsl(${h},${s}%,50%))`
    output.textContent = `{${r.toFixed(3)}, ${g.toFixed(3)}, ${bl.toFixed(3)}}`
  }

  function applyRgb255(r, g, b) {
    const [h,s,bv] = rgbToHsb(r,g,b)
    hSlider.value = h; sSlider.value = s; bSlider.value = bv
    update()
  }

  function getCurrentRgb255() {
    return hsbToRgb(+hSlider.value, +sSlider.value, +bSlider.value).map(v => Math.round(v*255))
  }

  hSlider.addEventListener('input', update)
  sSlider.addEventListener('input', update)
  bSlider.addEventListener('input', update)

  copyBtn.addEventListener('click', () => {
    pushHistory()
    navigator.clipboard.writeText(output.textContent).then(() => {
      copyBtn.textContent = 'COPIED'; copyBtn.classList.add('copied')
      setTimeout(() => { copyBtn.textContent = 'COPY'; copyBtn.classList.remove('copied') }, 1500)
    }).catch(() => {})
  })

  eyedropperBtn.addEventListener('click', async () => {
    if (!window.EyeDropper) return
    try {
      const result = await new EyeDropper().open()
      const hex = result.sRGBHex
      applyRgb255(parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16))
      pushHistory()
      eyedropperBtn.classList.add('active')
      setTimeout(() => eyedropperBtn.classList.remove('active'), 1000)
    } catch(e) {}
  })

  function pushHistory() {
    const [r,g,b] = getCurrentRgb255()
    const hex = rgbToHex(r,g,b)
    if (history[0] === hex) return
    history.unshift(hex)
    if (history.length > 5) history.pop()
    renderHistory()
  }

  function renderHistory() {
    historyRow.querySelectorAll('.history-swatch').forEach((sw, i) => {
      if (history[i]) {
        sw.style.background = history[i]
        sw.classList.remove('empty')
        sw.onclick = () => {
          const h = history[i]
          applyRgb255(parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16))
        }
      } else {
        sw.style.background = '#1a1a1e'
        sw.classList.add('empty')
        sw.onclick = null
      }
    })
  }

  savedHeader.addEventListener('click', () => {
    savedOpen = !savedOpen
    savedGrid.classList.toggle('open', savedOpen)
    savedToggle.textContent = savedOpen ? 'SAVED ▲' : 'SAVED ▼'
  })

  saveBtn.addEventListener('click', () => {
    const [r,g,b] = getCurrentRgb255()
    const [rf,gf,bf] = hsbToRgb(+hSlider.value, +sSlider.value, +bSlider.value)
    saved.push({ id: Date.now(), name: 'Color '+(saved.length+1), hex: rgbToHex(r,g,b), vex: `{${rf.toFixed(3)}, ${gf.toFixed(3)}, ${bf.toFixed(3)}}` })
    persistSaved(); renderSaved()
  })

  function renderSaved() {
    savedGrid.querySelectorAll('.saved-item').forEach(el => el.remove())
    saved.forEach(item => {
      const el = document.createElement('div')
      el.className = 'saved-item'
      el.innerHTML = `
        <div class="saved-swatch" style="background:${item.hex}"></div>
        <input class="saved-name" value="${item.name}" spellcheck="false">
        <span class="saved-value">${item.vex}</span>
        <span class="saved-del">×</span>
      `
      el.querySelector('.saved-swatch').addEventListener('click', () => {
        applyRgb255(parseInt(item.hex.slice(1,3),16), parseInt(item.hex.slice(3,5),16), parseInt(item.hex.slice(5,7),16))
        output.textContent = item.vex
      })
      const ni = el.querySelector('.saved-name')
      ni.addEventListener('change', () => { item.name = ni.value; persistSaved() })
      ni.addEventListener('click', e => e.stopPropagation())
      el.querySelector('.saved-value').addEventListener('click', () => navigator.clipboard.writeText(item.vex).catch(()=>{}))
      el.querySelector('.saved-del').addEventListener('click', () => { saved = saved.filter(s=>s.id!==item.id); persistSaved(); renderSaved() })
      savedGrid.insertBefore(el, saveBtn)
    })
  }

  function persistSaved() { localStorage.setItem('vex-cp-saved', JSON.stringify(saved)) }

  update(); renderHistory(); renderSaved()
</script>
</body>
</html>
